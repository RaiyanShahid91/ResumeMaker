<style>
    :root{
        --color-one: dodgerblue;
        --color-two: orange;
        --white-color: white;
        --black-color: black;
        --gray-color: gray;
        --font-size: 12px;
    }

    html{
        font-size: var(--font-size);
        word-wrap: break-word;
    }

    p{
        margin: 2.5px;
    }

    .heading{
        font-size: calc(var(--font-size) + 4px);
        font-weight: bold;
        padding: 5px 0 5px 0;
        background: transparent;
        color: var(--color-one);
    }

    .template_resume_image{
        text-align: center;
    }

    .profile-img{
        height: 100%;
        object-fit: contain;
        border-radius: 50%;
    }

    .template_resume_name{
        font-size: calc(var(--font-size) + 8px);
        font-weight: bold;
    }

    .template_resume_phone{
        color: var(--black-color);
    }

    .template_resume_email{
        color: var(--color-one);
    }

    .container{
        width: 100%;
        display: flex;
    }

    .container .left{
        flex: 45;
        overflow: hidden;
    }

    .container .right{
        flex: 55;
        overflow: hidden;
    }


    /* OBJECTIVE - OPEN */
    .template_objective{
        margin: 5px;
        font-size: calc(var(--font-size) + 0px);
    }
    /* OBJECTIVE - CLOSED */


    /* EDUCATIONAL DETAILS - OPEN */
    .element_educational_details{
        margin-top: 10px;
        background: var(--white-color);
    }

    .template_education_course{
        font-size: calc(var(--font-size) + 2px);
        font-weight: bold;
    }

    .template_education_university{
        color: var(--color-one);
    }

    .template_education_grade b{
        color: var(--color-one);
    }

    .template_education_duration{

    }
    /* EDUCATIONAL DETAILS - CLOSED */

    .element_work_experience{
        margin-top: 10px;
        background: var(--white-color);
    }

    .template_experience_job{
        font-size: calc(var(--font-size) + 2px);
        font-weight: bold;
    }

    .template_experience_company{
        color: var(--color-one);
    }

    .template_experience_description{
        color: var(--black-color);
    }

    .template_experience_duration{
        color: var(--gray-color);
    }
    /* WORK EXPERIENCE - CLOSED */

    }

    .template_project_description{
        color: var(--black-color);
    }

    .template_project_duration{
        color: var(--gray-color);
    }
    /* PROJECTS - CLOSED */

        margin-top: 10px;
        background: var(--white-color);
    }

    .template_skill_name{
        font-size: calc(var(--font-size) + 2px);
        font-weight: bold;
    }

    .element_languages_details,

        width : 100%;
        height: 80px;
        float: top;
    }

    .personal_details .top .left{
        width: 40%;
        height: calc(100% - 10px);
        float: left;
        text-align: center;
        padding-top: 10px;
    }

    .personal_details .top .middle{
        width: 20%;
        height: 100%;
        float: left;
    }

    .personal_details .top .right{
        width: 40%;
        height: calc(100% - 10px);
        float: right;
        text-align: center;
        padding-top: 10px;
    }

        text-align: center;
        float: top;
    }

</style>
