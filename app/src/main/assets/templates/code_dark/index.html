<meta name='viewport' content='user-scalable=0, width=device-width' />

<html>

    <body>

        <div class="header">
            <div class="header_left">
                <div class="template_resume_image"></div>
            </div>
            <div class="header_right">
                <p class="template_resume_name"></p>
                <p class="template_resume_email contact_line"></p>
                <p class="template_resume_phone contact_line"></p>
                <p class="template_resume_address contact_line"></p>
            </div>
        </div>

        <div class="content">

            <div class="div_objective">
                <p class="heading"><span class="prompt">$</span> about</p>
                <div class="template_objective"></div>
            </div>

            <div class="div_work_experience">
                <p class="heading"><span class="prompt">$</span> experience</p>
                <div class="template_work_experience"></div>
            </div>

            <div class="div_projects_details">
                <p class="heading"><span class="prompt">$</span> projects</p>
                <div class="template_projects_details"></div>
            </div>

            <div class="div_educational_details">
                <p class="heading"><span class="prompt">$</span> education</p>
                <div class="template_educational_details"></div>
            </div>

            <div class="div_skills_details">
                <p class="heading"><span class="prompt">$</span> skills</p>
                <div class="template_skills_details"></div>
            </div>

            <div class="div_achievements_details">
                <p class="heading"><span class="prompt">$</span> achievements</p>
                <div class="template_achievements_details"></div>
            </div>

            <div class="div_languages_details">
                <p class="heading"><span class="prompt">$</span> languages</p>
                <div class="template_languages_details"></div>
            </div>

            <div class="div_interests_details">
                <p class="heading"><span class="prompt">$</span> interests</p>
                <div class="template_interests_details"></div>
            </div>

            <div class="div_hobbies_details">
                <p class="heading"><span class="prompt">$</span> hobbies</p>
                <div class="template_hobbies_details"></div>
            </div>

            <div class="div_declaration">
                <p class="heading"><span class="prompt">$</span> declaration</p>
                <div class="template_declaration"></div>
            </div>

            <div class="outer_div_signature">
                <div class="div_declaration_place_date">
                    <div class="template_declaration_place"></div>
                    <div class="template_declaration_date"></div>
                </div>
                <div class="div_signature">
                    <div class="template_resume_signature"></div>
                </div>
            </div>

        </div>

    </body>

</html>

<style>
    :root{
        --color-one: #79c0ff;
        --color-two: #7ee787;
        --bg: #0d1117;
        --bg2: #161b22;
        --border: #30363d;
        --white-color: #e6edf3;
        --gray-color: #8b949e;
        --font-size: 11px;
    }

    html{ font-size: var(--font-size); word-wrap: break-word; }
    body{ margin: 0; background: var(--bg); color: var(--white-color); }
    p{ margin: 2px; }

    .header{
        background: var(--bg2); border-bottom: 1px solid var(--border);
        padding: 16px 20px; display: flex; align-items: center; gap: 16px;
    }

    .template_resume_image{
        width: 54px; height: 54px; border-radius: 50%; overflow: hidden;
        flex-shrink: 0; border: 1px solid var(--border); background: var(--bg);
    }
    .template_resume_image img{ width: 100%; height: 100%; object-fit: cover; }

    .template_resume_name{
        font-size: calc(var(--font-size) + 7px); font-weight: 600; color: var(--white-color); margin: 0 0 4px 0;
    }

    .contact_line{
        font-size: calc(var(--font-size) - 1px); color: var(--gray-color); display: inline; margin-right: 10px;
    }

    .content{ padding: 16px 20px; }

    .heading{
        font-size: calc(var(--font-size) + 1px); font-weight: 600; color: var(--color-two);
        margin: 16px 0 6px 0; font-family: monospace; border-bottom: 1px solid var(--border); padding-bottom: 4px;
    }

    .prompt{ color: var(--color-one); margin-right: 6px; }

    .template_objective, .template_declaration{
        font-size: var(--font-size); color: var(--white-color); line-height: 1.6; font-family: monospace;
    }

    .element_work_experience, .element_projects_details, .element_educational_details{
        margin-top: 8px; padding: 8px 10px; background: var(--bg2);
        border-radius: 6px; border: 1px solid var(--border);
    }

    .element_achievements_details, .element_skills_details, .element_languages_details,
    .element_interests_details, .element_hobbies_details{ margin-top: 4px; }

    .template_experience_job, .template_project_name, .template_education_course{
        font-weight: 600; color: var(--color-one); font-size: calc(var(--font-size) + 1px);
    }

    .template_experience_company, .template_project_link, .template_education_university{
        color: var(--color-two); font-size: var(--font-size);
    }

    .template_experience_duration, .template_project_duration, .template_education_duration{
        color: var(--gray-color); font-size: calc(var(--font-size) - 1px); font-family: monospace;
    }

    .template_education_grade b{ color: var(--color-two); }

    .template_experience_description, .template_project_description{
        color: var(--gray-color); margin-top: 4px; line-height: 1.5; font-size: var(--font-size);
    }

    .template_skill_name{
        display: inline-block; background: rgba(121,192,255,0.1); color: var(--color-one);
        border: 1px solid rgba(121,192,255,0.3); border-radius: 3px; padding: 2px 6px;
        margin: 2px; font-size: calc(var(--font-size) - 1px); font-family: monospace;
    }
    .template_skill_level{ color: var(--gray-color); font-size: calc(var(--font-size) - 2px); }

    .template_achievement_name, .template_language_name, .template_interest_name, .template_hobby_name{
        display: inline-block; color: var(--white-color); margin: 3px 6px 0 0; font-size: var(--font-size);
    }
    .template_achievement_name::before{ content: "# "; color: var(--color-two); }

    .outer_div_signature{ margin-top: 18px; display: flex; padding-bottom: 14px; }
    .div_declaration_place_date{ flex: 2; font-size: var(--font-size); color: var(--gray-color); }
    .div_signature{ flex: 1; text-align: right; }
    .signature-img{ width: 60px; object-fit: contain; }
</style>
