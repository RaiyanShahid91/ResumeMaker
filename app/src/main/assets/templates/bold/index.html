<style>
    :root{
        --color-one: dodgerblue;
        --color-two: orange;
        --white-color: white;
        --black-color: #222;
        --gray-color: #777;
        --font-size: 12px;
    }

    html{ font-size: var(--font-size); word-wrap: break-word; }
    body{ margin: 0; background: var(--white-color); }
    p{ margin: 2.5px; }

    .header_block{
        background: var(--color-one);
        color: var(--white-color);
        padding: 34px 24px 26px 24px;
        text-align: center;
    }

    .template_resume_image{
        width: 72px;
        height: 72px;
        border-radius: 50%;
        overflow: hidden;
        margin: 0 auto 14px auto;
        border: 3px solid var(--white-color);
        background: var(--white-color);
    }
    .template_resume_image img{ width: 100%; height: 100%; object-fit: cover; }

    .template_resume_name{
        font-size: calc(var(--font-size) + 14px);
        font-weight: 800;
        letter-spacing: 0.5px;
        margin: 0;
    }

    .contact_row{ margin-top: 8px; }
    .contact_row span{ display: inline-block; margin: 0 8px; font-size: calc(var(--font-size) - 1px); opacity: 0.9; }

    .accent_strip{ height: 6px; background: var(--color-two); }

    .content{ padding: 18px 22px; }

    .heading{
        display: inline-block;
        font-size: calc(var(--font-size) + 2px);
        font-weight: bold;
        color: var(--white-color);
        background: var(--color-two);
        padding: 4px 14px;
        border-radius: 3px;
        margin-top: 18px;
        margin-bottom: 6px;
    }

    .template_objective, .template_declaration{ font-size: calc(var(--font-size) + 1px); color: var(--black-color); }

    .element_educational_details, .element_work_experience, .element_projects_details,
    .element_skills_details, .element_hobbies_details, .element_languages_details,
    .element_interests_details, .element_achievements_details{
        margin-top: 10px;
        padding-left: 10px;
        border-left: 3px solid var(--color-one);
    }

    .template_education_course, .template_experience_job, .template_project_name, .template_skill_name{
        font-weight: bold;
        font-size: calc(var(--font-size) + 1px);
        color: var(--black-color);
    }

    .template_education_university, .template_experience_company, .template_project_link{
        color: var(--color-one);
        font-weight: 600;
    }

    .template_education_duration, .template_experience_duration, .template_project_duration{
        color: var(--gray-color);
        font-size: calc(var(--font-size) - 1px);
    }

    .template_education_grade b, .template_skill_level{ color: var(--color-two); }

    .template_experience_description, .template_project_description{ color: var(--black-color); }

    .template_hobby_name, .template_language_name, .template_interest_name, .template_achievement_name{
        display: inline-block;
        background: var(--color-one);
        color: var(--white-color);
        border-radius: 3px;
        padding: 3px 10px;
        margin: 3px 3px 0 0;
        font-size: calc(var(--font-size) - 1px);
    }

    .outer_div_signature{ margin-top: 26px; display: flex; padding-bottom: 20px; }
    .div_declaration_place_date{ flex: 2; font-size: calc(var(--font-size) + 1px); }
    .div_signature{ flex: 1; text-align: center; font-weight: bold; }
    .signature-img{ width: 75px; object-fit: contain; }
</style>
