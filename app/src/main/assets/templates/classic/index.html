<style>
    :root{
        --color-one: #2b2b2b;
        --color-two: dodgerblue;
        --white-color: white;
        --black-color: #1a1a1a;
        --gray-color: #666;
        --font-size: 12px;
    }

    html{ font-size: var(--font-size); word-wrap: break-word; font-family: Georgia, 'Times New Roman', serif; }
    body{ margin: 24px; background: var(--white-color); color: var(--black-color); text-align: center; }
    p{ margin: 2px; }

    .header{ position: relative; }

    .template_resume_image{
        position: absolute;
        top: 0;
        right: 0;
        width: 60px;
        height: 60px;
        border: 1px solid var(--color-one);
        overflow: hidden;
    }
    .template_resume_image img{ width: 100%; height: 100%; object-fit: cover; }

    .template_resume_name{
        font-size: calc(var(--font-size) + 10px);
        font-weight: bold;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin: 0;
    }

    .contact_row{ margin-top: 6px; font-size: calc(var(--font-size) - 1px); color: var(--gray-color); }

    .double_rule{ border-top: 1px solid var(--color-one); border-bottom: 1px solid var(--color-one); height: 3px; margin: 14px 0 18px 0; }

    .content{ text-align: left; }

    .heading{
        font-size: calc(var(--font-size) + 2px);
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
        text-align: center;
        border-bottom: 1px solid var(--color-one);
        padding-bottom: 3px;
        margin-top: 16px;
    }

    .template_objective, .template_declaration{ font-size: calc(var(--font-size) + 1px); text-align: left; }

    .element_educational_details, .element_work_experience, .element_projects_details,
    .element_skills_details, .element_hobbies_details, .element_languages_details,
    .element_interests_details, .element_achievements_details{
        margin-top: 8px;
        text-align: left;
    }

    .template_education_course, .template_experience_job, .template_project_name, .template_skill_name{
        font-weight: bold;
    }

    .template_education_university, .template_experience_company, .template_project_link{
        font-style: italic;
    }

    .template_education_duration, .template_experience_duration, .template_project_duration{
        color: var(--gray-color);
        font-size: calc(var(--font-size) - 1px);
        float: right;
    }

    .template_education_grade b, .template_skill_level{ color: var(--color-two); }

    .template_hobby_name, .template_language_name, .template_interest_name, .template_achievement_name{
        display: inline-block;
        margin-right: 14px;
    }

    .outer_div_signature{ margin-top: 24px; display: flex; padding-bottom: 16px; }
    .div_declaration_place_date{ flex: 2; font-size: calc(var(--font-size) + 0px); }
    .div_signature{ flex: 1; text-align: center; font-weight: bold; }
    .signature-img{ width: 70px; object-fit: contain; }
</style>
