<style>
    :root{
        --color-one: #2c6e49;
        --color-two: #ffc857;
        --header-bg: #2c6e49;
        --white-color: #ffffff;
        --black-color: #1b1b2f;
        --gray-color: #6b7c93;
        --light-bg: #f0f7f4;
        --font-size: 11px;
    }

    html{ font-size: var(--font-size); word-wrap: break-word; }
    body{ margin: 0; background: var(--white-color); }
    p{ margin: 2px; }

    .header{
        background: var(--header-bg); color: var(--white-color); padding: 18px 20px;
    }

    .header_top{ display: flex; align-items: center; gap: 14px; }

    .template_resume_image{
        width: 60px; height: 60px; border-radius: 50%; overflow: hidden;
        flex-shrink: 0; border: 2px solid rgba(255,255,255,0.4); background: rgba(255,255,255,0.1);
    }
    .template_resume_image img{ width: 100%; height: 100%; object-fit: cover; }

    .template_resume_name{
        font-size: calc(var(--font-size) + 7px); font-weight: 700; margin: 0 0 4px 0;
    }

    .header_info p{
        font-size: calc(var(--font-size) - 1px); color: rgba(255,255,255,0.8); margin: 2px 0;
    }

    .content{ padding: 14px 20px; }

    .heading{
        font-size: calc(var(--font-size) + 1px); font-weight: 700; color: var(--color-one);
        text-transform: uppercase; letter-spacing: 1px; margin: 14px 0 6px 0;
        padding: 4px 8px; background: var(--light-bg); border-left: 4px solid var(--color-one);
    }

    .template_objective, .template_declaration{
        font-size: var(--font-size); color: var(--black-color); line-height: 1.7;
    }

    .element_educational_details, .element_work_experience{
        margin-top: 8px; padding-bottom: 8px; border-bottom: 1px dotted #ccc;
    }

    .element_projects_details, .element_achievements_details,
    .element_skills_details, .element_languages_details,
    .element_interests_details, .element_hobbies_details{ margin-top: 5px; }

    .template_education_course, .template_experience_job, .template_project_name{
        font-weight: 700; color: var(--black-color); font-size: calc(var(--font-size) + 1px);
    }

    .template_education_university, .template_experience_company, .template_project_link{
        color: var(--color-one); font-size: var(--font-size);
    }

    .template_education_duration, .template_experience_duration, .template_project_duration{
        color: var(--gray-color); font-size: calc(var(--font-size) - 1px);
    }

    .template_education_grade b{ color: var(--color-two); }

    .template_experience_description, .template_project_description{
        color: #444; margin-top: 4px; line-height: 1.5; font-size: var(--font-size);
    }

    .template_skill_name{
        display: inline-block; background: var(--light-bg); color: var(--color-one);
        border: 1px solid var(--color-one); border-radius: 4px; padding: 3px 8px; margin: 3px 3px 0 0;
        font-size: calc(var(--font-size) - 1px);
    }
    .template_skill_level{ color: var(--gray-color); font-size: calc(var(--font-size) - 2px); }

    .template_achievement_name{
        display: block; font-size: var(--font-size); color: var(--black-color); margin: 4px 0;
        padding-left: 14px; position: relative;
    }
    .template_achievement_name::before{
        content: "●"; position: absolute; left: 0; color: var(--color-two);
    }

    .template_language_name, .template_interest_name, .template_hobby_name{
        display: inline-block; background: var(--color-two); color: var(--black-color);
        border-radius: 3px; padding: 2px 8px; margin: 3px 3px 0 0; font-size: calc(var(--font-size) - 1px);
