<style>
    :root{
        --color-one: #1a3a5c;
        --color-two: #8b0000;
        --white-color: #ffffff;
        --black-color: #222222;
        --gray-color: #555555;
        --light-rule: #c0c0c0;
        --font-size: 12px;
    }

    p{ margin: 2px; }

    }

    .template_resume_name{
        font-size: calc(var(--font-size) + 8px); font-weight: 700; color: var(--color-one);

    }

        font-size: calc(var(--font-size) + 1px); font-weight: 700; color: var(--color-one);

        padding-bottom: 3px; border-bottom: 1px solid var(--color-one);
    }

    .template_objective, .template_declaration{

    }

    .element_educational_details, .element_work_experience{
        margin-top: 8px; display: flex; justify-content: space-between; align-items: flex-start;
        padding-bottom: 6px; border-bottom: 1px dotted var(--light-rule);
    }

    .element_projects_details, .element_achievements_details{
        margin-top: 6px; padding-left: 14px; position: relative;
    }
    .element_projects_details::before, .element_achievements_details::before{
        content: "–"; position: absolute; left: 0; color: var(--color-two);
    }

    .element_interests_details, .element_hobbies_details{ margin-top: 4px; }

    .template_education_university, .template_experience_company{

    }

    .template_education_duration, .template_experience_duration{

    .template_project_link{ color: var(--color-two); font-style: italic; font-size: var(--font-size); }
