<style>
    :root{
        --color-one: #6a3df5;
        --color-two: #ffb86b;
        --white-color: white;
        --black-color: #222;
        --gray-color: #888;
        --font-size: 12px;
    }

    html{ font-size: var(--font-size); word-wrap: break-word; }
    body{ margin: 0; background: var(--white-color); }
    p{ margin: 2.5px; }

    .page{ display: flex; min-height: 100%; }

    .sidebar{
        width: 34%;
        background: var(--color-one);
        color: var(--white-color);
        padding: 20px 16px;
        box-sizing: border-box;
    }

    .template_resume_image{
        width: 80px;
        height: 80px;
        border-radius: 50%;
        overflow: hidden;
        border: 3px solid var(--white-color);
        margin: 0 auto 10px auto;
    }
    .template_resume_image img{ width: 100%; height: 100%; object-fit: cover; }

    .sidebar > .template_resume_name{
        text-align: center;
        font-size: calc(var(--font-size) + 4px);
        font-weight: bold;
        margin-bottom: 16px;
    }

    .sidebar_heading{
        font-size: calc(var(--font-size) + 1px);
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--color-two);
        margin-bottom: 4px;
    }

    .sidebar_section{ margin-top: 16px; word-break: break-word; }

    .template_resume_phone, .template_resume_email, .template_resume_address{ font-size: calc(var(--font-size) - 1px); }

    .template_skill_name{ font-weight: bold; display: block; }
    .template_skill_level{ font-size: calc(var(--font-size) - 1px); opacity: 0.85; display: block; margin-bottom: 6px; }

    .template_hobby_name, .template_language_name, .template_interest_name{
        display: inline-block;
        background: rgba(255,255,255,0.18);
        border-radius: 8px;
        padding: 2px 8px;
        margin: 2px 2px 0 0;
        font-size: calc(var(--font-size) - 1px);
    }

    .main{ width: 66%; padding: 20px; box-sizing: border-box; }

    .heading{
        font-size: calc(var(--font-size) + 3px);
        font-weight: bold;
        color: var(--color-one);
        margin-top: 16px;
        margin-bottom: 6px;
    }

    .template_objective, .template_declaration{ color: var(--black-color); }

    .element_educational_details, .element_work_experience, .element_projects_details,
    .element_achievements_details{ margin-top: 8px; }

    .template_education_course, .template_experience_job, .template_project_name{
        font-weight: bold;
    }

    .template_education_university, .template_experience_company, .template_project_link{ color: var(--color-one); }

    .template_education_duration, .template_experience_duration, .template_project_duration{
        color: var(--gray-color);
        font-size: calc(var(--font-size) - 1px);
    }

    .template_education_grade b{ color: var(--color-two); }
    .template_achievement_name{ display: block; margin-top: 4px; }

    .div_declaration_place_date{ flex: 2; }
