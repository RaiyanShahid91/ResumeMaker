<style>
    :root{
        --color-one: dodgerblue;
        --color-two: #2bb673;
        --white-color: white;
        --black-color: #222;
        --gray-color: #777;
        --font-size: 12px;
    }

    html{ font-size: var(--font-size); word-wrap: break-word; }
    body{ margin: 18px; background: var(--white-color); }
    p{ margin: 2.5px; }

    .header{ display: flex; align-items: center; border-bottom: 3px solid var(--color-one); padding-bottom: 10px; }

    .template_resume_image{
        width: 64px;
        height: 64px;
        border-radius: 6px;
        overflow: hidden;
        flex-shrink: 0;
    }
    .template_resume_image img{ width: 100%; height: 100%; object-fit: cover; }

    .header_text{ margin-left: 14px; }

    .template_resume_name{
        font-size: calc(var(--font-size) + 7px);
        font-weight: bold;
        margin: 0;
        color: var(--color-one);
    }

    .contact_row span{ margin-right: 10px; font-size: calc(var(--font-size) - 1px); color: var(--gray-color); }

    .div_objective{ margin-top: 12px; }

    .columns{ display: flex; margin-top: 6px; }
    .col_left{ width: 36%; padding-right: 14px; box-sizing: border-box; border-right: 1px solid #eee; }
    .col_right{ width: 64%; padding-left: 14px; box-sizing: border-box; }

    .heading{
        font-size: calc(var(--font-size) + 2px);
        font-weight: bold;
        color: var(--white-color);
        background: var(--color-two);
        padding: 3px 8px;
        margin-top: 14px;
        border-radius: 3px;
    }

    .template_objective, .template_declaration{ font-size: calc(var(--font-size) + 1px); color: var(--black-color); }

    .element_educational_details, .element_work_experience, .element_projects_details,
    .element_skills_details, .element_hobbies_details, .element_languages_details,
    .element_interests_details, .element_achievements_details{
        margin-top: 8px;
    }

    .template_education_course, .template_experience_job, .template_project_name, .template_skill_name{
        font-weight: bold;
        font-size: calc(var(--font-size) + 0px);
    }

    .template_education_university, .template_experience_company, .template_project_link{ color: var(--color-one); }

    .template_education_duration, .template_experience_duration, .template_project_duration{
        color: var(--gray-color);
        font-size: calc(var(--font-size) - 1px);
        display: block;
    }

    .template_education_grade b, .template_skill_level{ color: var(--color-two); }

    .template_hobby_name, .template_language_name, .template_interest_name, .template_achievement_name{
        display: block;
        margin-top: 3px;
        font-size: calc(var(--font-size) - 1px);
    }

    .outer_div_signature{ margin-top: 20px; display: flex; padding-bottom: 16px; }
    .div_declaration_place_date{ flex: 2; font-size: calc(var(--font-size) + 0px); }
    .div_signature{ flex: 1; text-align: center; font-weight: bold; }
    .signature-img{ width: 65px; object-fit: contain; }
