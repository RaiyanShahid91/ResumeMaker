<style>
    :root{
        --color-one: #e17055;
        --color-two: #fdcb6e;
        --white-color: #ffffff;
        --black-color: #2d3436;
        --gray-color: #b2bec3;
        --light-gray: #f5f5f5;
        --font-size: 11px;
    }

    html{ font-size: var(--font-size); word-wrap: break-word; }
    body{ margin: 0; background: var(--white-color); }
    p{ margin: 2px; }

    .header{
        text-align: center; padding: 28px 20px 18px 20px;
        border-bottom: 1px solid #ececec;
    }

    .template_resume_image{
        width: 68px; height: 68px; border-radius: 50%; overflow: hidden;
        margin: 0 auto 12px auto; border: 3px solid var(--color-one); background: var(--light-gray);
    }
    .template_resume_image img{ width: 100%; height: 100%; object-fit: cover; }

    .template_resume_name{
        font-size: calc(var(--font-size) + 11px); font-weight: 300;
        color: var(--black-color); margin: 0 0 6px 0; letter-spacing: -1px;
    }

    .contact_row{ font-size: calc(var(--font-size) - 1px); color: var(--gray-color); }
    .contact_row span{ margin: 0 6px; }

    .content{ padding: 16px 24px; }

    .heading{
        font-size: calc(var(--font-size) + 1px); font-weight: 600; text-transform: uppercase;
        letter-spacing: 2px; color: var(--color-one); margin: 16px 0 8px 0;
        padding-bottom: 4px; border-bottom: 2px solid var(--color-one);
    }

    .template_objective, .template_declaration{
        font-size: var(--font-size); color: var(--black-color); line-height: 1.7;
    }

    .element_projects_details{
        margin-top: 10px; padding: 10px 12px; background: var(--light-gray);
        border-radius: 6px; border-left: 3px solid var(--color-one);
    }

    .element_work_experience, .element_educational_details{
        margin-top: 8px; padding: 8px 0; border-bottom: 1px solid #f0f0f0;
    }

    .element_achievements_details, .element_skills_details,
    .element_languages_details, .element_interests_details, .element_hobbies_details{
        margin-top: 4px;
    }

    .template_project_name, .template_experience_job, .template_education_course{
        font-weight: 700; color: var(--black-color); font-size: calc(var(--font-size) + 1px);
    }

    .template_project_link, .template_experience_company, .template_education_university{
        color: var(--color-one); font-size: var(--font-size);
    }

    .template_experience_duration, .template_project_duration, .template_education_duration{
        color: var(--gray-color); font-size: calc(var(--font-size) - 1px);
    }

    .template_project_description, .template_experience_description{
        color: #636e72; margin-top: 4px; line-height: 1.5; font-size: var(--font-size);
    }

    .template_education_grade b{ color: var(--color-two); }

    .template_skill_name{
        display: inline-block; background: var(--color-one); color: var(--white-color);
        border-radius: 4px; padding: 3px 9px; margin: 3px 3px 0 0; font-size: calc(var(--font-size) - 1px);
    }
    .template_skill_level{ color: var(--gray-color); font-size: calc(var(--font-size) - 2px); }

    .template_achievement_name, .template_language_name, .template_interest_name, .template_hobby_name{
        display: inline-block; color: var(--black-color); margin: 3px 10px 0 0; font-size: var(--font-size);
    }
    .template_achievement_name::before{ content: "◆ "; color: var(--color-two); }

    .outer_div_signature{ margin-top: 20px; display: flex; padding-bottom: 16px; }
    .div_declaration_place_date{ flex: 2; font-size: var(--font-size); color: var(--gray-color); }
    .div_signature{ flex: 1; text-align: right; }
    .signature-img{ width: 65px; object-fit: contain; }
</style>
