<style>
    :root{
        --color-one: #6c63ff;
        --color-two: #ff6b9d;
        --white-color: #ffffff;
        --black-color: #1a1a2e;
        --gray-color: #6c757d;
        --bg-light: #f8f7ff;
        --font-size: 11px;
    }

    html{ font-size: var(--font-size); word-wrap: break-word; }
    body{ margin: 0; background: var(--white-color); }
    p{ margin: 2px; }

    .header{
        background: linear-gradient(135deg, var(--color-one), var(--color-two));
        color: var(--white-color); padding: 20px; display: flex; align-items: center; gap: 16px;
    }

    .template_resume_image{
        width: 64px; height: 64px; border-radius: 50%; overflow: hidden;
        flex-shrink: 0; border: 3px solid rgba(255,255,255,0.4); background: rgba(255,255,255,0.2);
    }
    .template_resume_image img{ width: 100%; height: 100%; object-fit: cover; }

    .template_resume_name{
        font-size: calc(var(--font-size) + 9px); font-weight: 800;
        margin: 0 0 4px 0; letter-spacing: -0.5px;
    }

    .contact_bar{ font-size: calc(var(--font-size) - 1px); opacity: 0.85; }
    .contact_bar span{ margin-right: 2px; }
    .sep{ opacity: 0.6; }

    .content{ padding: 16px 20px; }

    .heading{
        font-size: calc(var(--font-size) + 2px); font-weight: 700; color: var(--color-one);
        margin: 16px 0 6px 0; position: relative; padding-bottom: 4px;
    }
    .heading::after{
        content: ''; position: absolute; bottom: 0; left: 0;
        width: 32px; height: 2px; background: var(--color-two); border-radius: 2px;
    }

    .template_objective, .template_declaration{
        font-size: var(--font-size); color: var(--gray-color); line-height: 1.7;
    }

    .element_work_experience, .element_projects_details{
        margin-top: 10px; padding: 10px 12px; background: var(--bg-light);
        border-radius: 8px; border-top: 3px solid var(--color-one);
    }

    .element_educational_details{
        margin-top: 8px; padding: 8px 0; border-bottom: 1px dashed #ddd;
    }

    .element_achievements_details, .element_skills_details,
    .element_languages_details, .element_interests_details, .element_hobbies_details{
        margin-top: 4px;
    }

    .template_experience_job, .template_project_name{
        font-weight: 700; color: var(--black-color); font-size: calc(var(--font-size) + 1px);
    }

    .template_education_course{ font-weight: 700; color: var(--black-color); }

    .template_experience_company, .template_project_link, .template_education_university{
        color: var(--color-one); font-size: var(--font-size);
    }

    .template_experience_duration, .template_project_duration, .template_education_duration{
        color: var(--gray-color); font-size: calc(var(--font-size) - 1px);
    }

    .template_education_grade b{ color: var(--color-two); }

    .template_experience_description, .template_project_description{
        color: var(--gray-color); margin-top: 4px; line-height: 1.5; font-size: var(--font-size);
    }

    .template_skill_name{
        display: inline-block; background: linear-gradient(135deg, var(--color-one), var(--color-two));
        color: var(--white-color); border-radius: 20px; padding: 3px 10px; margin: 3px 3px 0 0;
        font-size: calc(var(--font-size) - 1px);
    }
    .template_skill_level{ display: none; }

    .template_achievement_name, .template_language_name, .template_interest_name, .template_hobby_name{
        display: inline-block; margin: 3px 8px 0 0; color: var(--black-color); font-size: var(--font-size);
    }
    .template_achievement_name::before{ content: "✦ "; color: var(--color-two); }

    .outer_div_signature{ margin-top: 20px; display: flex; padding-bottom: 16px; }
    .div_declaration_place_date{ flex: 2; font-size: var(--font-size); color: var(--gray-color); }
    .div_signature{ flex: 1; text-align: right; }
    .signature-img{ width: 65px; object-fit: contain; }
</style>
