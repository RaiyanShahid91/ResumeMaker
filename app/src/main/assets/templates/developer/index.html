<style>
    :root{
        --color-one: #00b894;
        --color-two: #55efc4;
        --sidebar-bg: #1e2d3d;
        --white-color: #ffffff;
        --black-color: #2d3436;
        --gray-color: #636e72;
        --font-size: 11px;
    }

    html{ font-size: var(--font-size); word-wrap: break-word; }
    body{ margin: 0; background: var(--white-color); }
    p{ margin: 2px; }

    .layout{ display: flex; min-height: 100vh; }

    .sidebar{
        width: 36%;
        background: var(--sidebar-bg);
        color: var(--white-color);
        padding: 20px 12px;
        box-sizing: border-box;
    }

    .template_resume_image{
        width: 58px; height: 58px; border-radius: 50%; overflow: hidden;
        margin: 0 auto 10px auto; border: 2px solid var(--color-one);
        background: rgba(255,255,255,0.08);
    }
    .template_resume_image img{ width: 100%; height: 100%; object-fit: cover; }

    .template_resume_name{
        font-size: calc(var(--font-size) + 5px); font-weight: bold;
        color: var(--color-one); text-align: center; margin: 0 0 10px 0;
    }

    .sidebar_contact p{
        font-size: calc(var(--font-size) - 1px); color: rgba(255,255,255,0.65);
        margin: 3px 0; word-break: break-all;
    }

    .sidebar_section{ margin-top: 14px; }

    .sidebar_heading{
        font-size: var(--font-size); font-weight: bold; color: var(--color-one);
        text-transform: uppercase; letter-spacing: 1px; margin: 0 0 6px 0;
        padding-bottom: 3px; border-bottom: 1px solid rgba(255,255,255,0.15);
    }

    .template_skill_name{
        display: inline-block; background: rgba(0,184,148,0.15); color: var(--color-one);
        border: 1px solid rgba(0,184,148,0.4); border-radius: 3px; padding: 2px 6px;
        margin: 2px 2px 0 0; font-size: calc(var(--font-size) - 1px);
    }
    .template_skill_level{ display: none; }

    .template_language_name, .template_interest_name, .template_hobby_name{
        display: block; color: rgba(255,255,255,0.7); margin: 3px 0;
        font-size: calc(var(--font-size) - 1px); padding-left: 8px;
    }
    .template_language_name::before, .template_hobby_name::before, .template_interest_name::before{
        content: "▸ "; color: var(--color-one);
    }

    .main{ flex: 1; padding: 18px 14px; box-sizing: border-box; }

    .heading{
        font-size: calc(var(--font-size) + 2px); font-weight: 700; color: var(--sidebar-bg);
        margin: 14px 0 6px 0; padding-left: 8px; border-left: 3px solid var(--color-one);
    }

    .template_objective, .template_declaration{
        font-size: var(--font-size); color: var(--black-color); line-height: 1.6;
    }

    .element_work_experience, .element_projects_details, .element_educational_details{
        margin-top: 8px; padding: 8px; background: #f0fdf9;
        border-radius: 4px; border-left: 2px solid var(--color-one);
    }

    .element_achievements_details{ margin-top: 5px; }

    .template_experience_job, .template_project_name, .template_education_course{
        font-weight: bold; color: var(--black-color); font-size: calc(var(--font-size) + 1px);
    }

    .template_experience_company, .template_project_link, .template_education_university{
        color: var(--color-one); font-size: var(--font-size);
    }

    .template_experience_duration, .template_project_duration, .template_education_duration{
        color: var(--gray-color); font-size: calc(var(--font-size) - 1px);
    }

    .template_education_grade b{ color: var(--color-one); }

    .template_experience_description, .template_project_description{
        color: var(--black-color); margin-top: 4px; line-height: 1.5;
