<style>
    :root{
        --color-one: #8a6d3b;
        --color-two: #c9a86a;
        --white-color: white;
        --black-color: #2a2a2a;
        --gray-color: #888;
        --font-size: 12px;
    }

    html{ font-size: var(--font-size); word-wrap: break-word; font-family: Georgia, 'Times New Roman', serif; }
    body{ margin: 28px; background: var(--white-color); color: var(--black-color); }
    p{ margin: 2px; }

    .header{ display: flex; align-items: center; }

    .template_resume_image{
        width: 66px;
        height: 66px;
        border-radius: 50%;
        overflow: hidden;
        flex-shrink: 0;
        border: 1px solid var(--color-two);
    }
    .template_resume_image img{ width: 100%; height: 100%; object-fit: cover; }

    .header_text{ margin-left: 18px; }

    .template_resume_name{
        font-size: calc(var(--font-size) + 10px);
        font-weight: normal;
        letter-spacing: 1px;
        margin: 0;
        color: var(--color-one);
    }

    .contact_row{ margin-top: 6px; font-size: calc(var(--font-size) - 1px); color: var(--gray-color); }
    .contact_row span{ margin-right: 12px; }

    .rule{ height: 1px; background: var(--color-two); margin: 18px 0 20px 0; }

    .heading{
        display: inline-block;
        font-size: calc(var(--font-size) + 1px);
        font-weight: normal;
        text-transform: uppercase;
        letter-spacing: 2.5px;
        color: var(--color-one);
        margin-top: 18px;
        margin-bottom: 8px;
        border-bottom: 2px solid var(--color-two);
        padding-bottom: 4px;
    }

    .template_objective, .template_declaration{ font-size: calc(var(--font-size) + 1px); color: var(--black-color); }

    .element_educational_details, .element_work_experience, .element_projects_details,
    .element_skills_details, .element_hobbies_details, .element_languages_details,
    .element_interests_details, .element_achievements_details{
        margin-top: 10px;
    }

    .template_education_course, .template_experience_job, .template_project_name, .template_skill_name{
        font-weight: bold;
        font-size: calc(var(--font-size) + 1px);
        color: var(--black-color);
    }

    .template_education_university, .template_experience_company, .template_project_link{
        color: var(--color-one);
        font-style: italic;
    }

    .template_education_duration, .template_experience_duration, .template_project_duration{
        color: var(--gray-color);
        font-size: calc(var(--font-size) - 1px);
        font-style: italic;
    }

    .template_education_grade b, .template_skill_level{ color: var(--color-one); }

    .template_hobby_name, .template_language_name, .template_interest_name, .template_achievement_name{
        display: inline-block;
        margin: 3px 14px 0 0;
        font-size: calc(var(--font-size) - 1px);
        color: var(--black-color);
    }
    .template_hobby_name::before, .template_language_name::before,
    .template_interest_name::before, .template_achievement_name::before{
        content: "\2014";
        margin-right: 5px;
        color: var(--color-two);
    }

    .outer_div_signature{ margin-top: 26px; display: flex; padding-bottom: 20px; }
    .div_declaration_place_date{ flex: 2; font-size: calc(var(--font-size) + 1px); font-style: italic; }
    .div_signature{ flex: 1; text-align: center; font-weight: bold; }
    .signature-img{ width: 75px; object-fit: contain; }
</style>
